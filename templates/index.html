<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Proximity Stopwatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="background-gradient"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>⏱️ Study Tracker</h1>
      <p class="subtitle">AI-Powered Presence Detection</p>
    </div>

    <!-- Stopwatch Display -->
    <div class="stopwatch-card">
      <div id="stopwatch" class="stopwatch-display" aria-label="Stopwatch display">00:00:00</div>
      <p id="status" class="status-indicator" aria-live="polite">🔵 Idle</p>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <button id="restart-btn" class="btn btn-danger" aria-label="Restart stopwatch">
        <span class="icon">🔄</span> Restart
      </button>
      <button id="reconnect-btn" class="btn btn-info" aria-label="Reconnect to presence sensor">
        <span class="icon">🔗</span> Reconnect
      </button>
    </div>

    <!-- Session Log Panel -->
    <div class="panel session-log-panel">
      <h2>📋 Session History</h2>
      <div class="button-row">
        <button id="refresh-log" class="btn btn-sm btn-secondary" aria-label="Refresh session log">🔁 Refresh</button>
        <button id="delete-log" class="btn btn-sm btn-danger" aria-label="Delete all session logs">🗑️ Clear</button>
      </div>
      <ul id="log-entries" class="log-entries" aria-label="Session log entries"></ul>
    </div>

    <!-- User Management Panel -->
    <div class="panel user-management-panel">
      <h2>👥 Authorized Users</h2>
      <div class="selected-user-info">
        <span class="label">Selected:</span> <span id="selected-person" class="selected-name">None</span>
      </div>

      <ul id="authorized-users-list" class="authorized-users-list"></ul>

      <div class="enroll-section">
        <h3>Add New User</h3>
        <div class="form-group">
          <input
            type="text"
            id="new-user-name"
            class="input-field"
            placeholder="Enter name"
            aria-label="User name for enrollment"
          />
        </div>

        <div class="enroll-methods">
          <button type="button" id="enroll-btn" class="btn btn-primary btn-full">
            <span class="icon">📷</span> Enroll via Webcam
          </button>

          <p class="section-hint">Or upload a photo:</p>
          <div class="enroll-photo-row">
            <input
              type="file"
              id="photo-upload"
              class="file-input"
              accept="image/jpeg,image/png,image/webp,image/gif,image/bmp"
              aria-label="Upload photo for enrollment"
            />
            <button type="button" id="enroll-photo-btn" class="btn btn-primary btn-full">
              <span class="icon">🖼️</span> Upload &amp; Enroll
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/script.js" defer></script>
</body>
</html>
